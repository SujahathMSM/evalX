[project]
name = "evalx"
version = "0.1.0"
description = "Eval harness for LLM apps: golden datasets, code + LLM-judge scoring, regression tracking, CI gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "litellm>=1.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.9", "streamlit", "pandas"]
# Browser for the dashboard end-to-end test: also run `playwright install chromium`.
e2e = ["playwright==1.63.0"]

[project.scripts]
evalx = "evalx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end through the real CLI process, HTTP and browser (local fakes, no keys)",
    "live: calls a real LLM provider; skipped unless its API key is set",
]

[tool.ruff]
line-length = 100
target-version = "py311"
