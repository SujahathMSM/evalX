name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -e ".[dev,e2e]"
          python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Tests (unit + end-to-end)
        # tests/e2e drives the real CLI against a local fake LLM server and
        # renders the dashboard in headless Chromium. Live-provider tests
        # (-m live) skip here: CI holds no API key.
        run: python -m pytest -q

      - name: Eval gate (demo suite)
        # The demo app scores a mean of 0.500; the gate fails the build if a
        # change ever drags it below 0.4. Point --suite at your real dataset
        # to gate what actually matters.
        # The Markdown report lands on the workflow run's summary page.
        run: >-
          evalx run --suite datasets/demo/v1 --target examples.demo_app:answer
          --fail-under 0.4 --no-save
          --report "markdown:$GITHUB_STEP_SUMMARY"
