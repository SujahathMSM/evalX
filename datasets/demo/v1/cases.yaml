# Demo golden dataset: 6 hand-written cases (2 easy, 2 medium, 2 adversarial).
# The demo app passes the easy ones, gets partial credit on medium,
# and hallucinates on the adversarial ones -- watch the harness catch it.

- id: q001
  question: "What was the company's revenue in 2024?"
  checks:
    - {type: contains, expected: "$4.2M"}
  tags: [finance, numeric]
  difficulty: easy

- id: q002
  question: "Who is the CEO?"
  checks:
    - {type: exact_match, expected: "The CEO is Jane Doe."}
  tags: [factual]
  difficulty: easy

- id: q003
  question: "Why did operating costs rise in Q3?"
  checks:
    - {type: contains, expected: "warehouse", weight: 1.0}
    - {type: contains, expected: "supply chain", weight: 1.0}
  judge:
    rubric: "Does the answer explain WHY costs rose, naming the warehouse expansion as the primary cause? 1.0 = names warehouse expansion and the mechanism; 0.5 = mentions supply chain only; 0.0 = unrelated or invented."
    weight: 1.0
  tags: [finance, reasoning]
  difficulty: medium

- id: q004
  question: "What did the CEO say about the Mars expansion?"
  checks:
    - {type: regex, expected: "(?i)no information|don't know|not in"}
  tags: [adversarial]
  difficulty: hard

- id: q005
  question: "What is the revenue forecast for Q4?"
  checks:
    - {type: regex, expected: "(?i)no information|don't know|not in|forecast is not"}
  tags: [adversarial]
  difficulty: hard

- id: q006
  question: "Compare 2024 revenue to 2023."
  checks:
    - {type: contains, expected: "$4.2M", weight: 1.0}
    - {type: contains, expected: "$3.8M", weight: 1.0}
  judge:
    rubric: "Does the answer give BOTH figures ($4.2M for 2024, $3.8M for 2023) and state the direction of change? 1.0 = both figures with comparison; 0.5 = one figure only; 0.0 = no figures or invented numbers."
    weight: 1.0
  tags: [finance, numeric, reasoning]
  difficulty: medium
