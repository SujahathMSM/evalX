# AeroIntel dogfood dataset: evalx grading the AeroIntel RAG end to end.
# Converted 2026-10-29 from evals/golden_faa.json in the aerointel repo
# (FAA AC 43.13-1B). Conversion rules:
# - answerable: one `contains` check per golden fact; cases with 2+ facts
#   also get a judge rubric quoting every fact (paraphrase insurance).
# - off_topic -> refusal cases: one regex matching the service's four real
#   refusal wordings (distance gate, unknown terms, not-in-context,
#   unverified numbers). difficulty: generic=easy, outside=medium,
#   near_topic=hard.
# Regenerate from the golden file rather than hand-editing single cases.
- id: cable-critical-fatigue-area
  question: How is a critical fatigue area defined for aircraft control cables?
  checks:
  - type: contains
    expected: runs over, under, or around a pulley
  - type: contains
    expected: within 1 foot of a swaged-on fitting
  judge:
    rubric: 'The manual (FAA AC 43.13-1B) states these facts: (1) runs over, under, or around a pulley; (2) within 1 foot of a swaged-on fitting. Score 1.0 if the answer conveys ALL of them, 0.5 if it conveys only some, 0.0 if it conveys none or invents figures the manual does not contain.'
    weight: 1.0
  tags:
  - aerointel
  - answerable
  difficulty: medium
